<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="fem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6FFFA" />
      <stop offset="100%" stop-color="#B2F5EA" />
    </linearGradient>
    <linearGradient id="fem-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2810" />
      <stop offset="100%" stop-color="#2D1504" />
    </linearGradient>
    <linearGradient id="fem-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="80" cy="80" r="78" fill="url(#fem-bg)" stroke="#14B8A6" stroke-width="3" />

  <!-- Back Hair Bun / Volume -->
  <circle cx="80" cy="48" r="32" fill="url(#fem-hair)" />
  <circle cx="112" cy="52" r="14" fill="url(#fem-hair)" />
  <circle cx="48" cy="52" r="14" fill="url(#fem-hair)" />

  <!-- Torso / Clothes -->
  <path d="M36 148 C36 116, 52 104, 80 104 C108 104, 124 116, 124 148 Z" fill="url(#fem-shirt)" filter="url(#soft-shadow)" />

  <!-- Collar / Scarf -->
  <path d="M68 104 L80 120 L92 104 Z" fill="#F0FDFA" />
  <!-- ID Badge / Teacher Pen -->
  <rect x="94" y="118" width="6" height="18" rx="3" fill="#F59E0B" />

  <!-- Neck -->
  <rect x="73" y="86" width="14" height="20" rx="7" fill="#FCD34D" opacity="0.9" />

  <!-- Head -->
  <circle cx="80" cy="68" r="28" fill="#FDE68A" filter="url(#soft-shadow)" />

  <!-- Hair Bangs / Front Hairstyle -->
  <path d="M52 64 C52 40, 72 36, 80 36 C88 36, 108 40, 108 64 C104 52, 94 48, 80 48 C66 48, 56 52, 52 64 Z" fill="url(#fem-hair)" />
  <path d="M52 64 Q56 80, 58 84 Q62 72, 64 64 Z" fill="url(#fem-hair)" />
  <path d="M108 64 Q104 80, 102 84 Q98 72, 96 64 Z" fill="url(#fem-hair)" />

  <!-- Cheeks Blush -->
  <ellipse cx="64" cy="74" rx="5" ry="3" fill="#FB7185" opacity="0.45" />
  <ellipse cx="96" cy="74" rx="5" ry="3" fill="#FB7185" opacity="0.45" />

  <!-- Eyes -->
  <circle cx="68" cy="68" r="3.5" fill="#1E293B" />
  <circle cx="69.5" cy="66.5" r="1.2" fill="#FFFFFF" />
  <circle cx="92" cy="68" r="3.5" fill="#1E293B" />
  <circle cx="93.5" cy="66.5" r="1.2" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M63 60 Q68 57, 73 60" stroke="#4A2810" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M87 60 Q92 57, 97 60" stroke="#4A2810" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Cute Glasses -->
  <rect x="58" y="60" width="18" height="15" rx="5" fill="none" stroke="#0F766E" stroke-width="2.5" />
  <rect x="84" y="60" width="18" height="15" rx="5" fill="none" stroke="#0F766E" stroke-width="2.5" />
  <line x1="76" y1="67" x2="84" y2="67" stroke="#0F766E" stroke-width="2.5" />

  <!-- Warm Smile -->
  <path d="M74 76 Q80 82, 86 76" stroke="#9A3412" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Small Graduation Cap Pin / Star Badge -->
  <g transform="translate(112, 112) scale(0.8)">
    <circle cx="16" cy="16" r="15" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
    <path d="M11 16 L15 20 L22 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
