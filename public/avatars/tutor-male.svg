<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="male-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="male-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    <linearGradient id="male-shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="male-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="80" cy="80" r="78" fill="url(#male-bg)" stroke="#3B82F6" stroke-width="3" />

  <!-- Torso / Jacket -->
  <path d="M34 148 C34 116, 50 104, 80 104 C110 104, 126 116, 126 148 Z" fill="url(#male-shirt)" filter="url(#male-shadow)" />

  <!-- Shirt & Tie -->
  <path d="M68 104 L80 128 L92 104 Z" fill="#F8FAFC" />
  <path d="M77 114 L83 114 L82 136 L80 140 L78 136 Z" fill="#F59E0B" />

  <!-- Neck -->
  <rect x="73" y="86" width="14" height="20" rx="7" fill="#FCD34D" opacity="0.9" />

  <!-- Head -->
  <circle cx="80" cy="68" r="28" fill="#FDE68A" filter="url(#male-shadow)" />

  <!-- Ears -->
  <circle cx="51" cy="70" r="6" fill="#FCD34D" />
  <circle cx="109" cy="70" r="6" fill="#FCD34D" />

  <!-- Male Neat Haircut -->
  <path d="M52 64 C50 42, 62 34, 80 34 C98 34, 110 42, 108 64 C104 54, 98 46, 80 46 C62 46, 56 54, 52 64 Z" fill="url(#male-hair)" />
  <path d="M52 56 Q66 40, 84 46 Q72 44, 52 56 Z" fill="url(#male-hair)" />

  <!-- Cheeks Blush -->
  <ellipse cx="64" cy="74" rx="4" ry="2.5" fill="#FB7185" opacity="0.35" />
  <ellipse cx="96" cy="74" rx="4" ry="2.5" fill="#FB7185" opacity="0.35" />

  <!-- Eyes -->
  <circle cx="68" cy="68" r="3.5" fill="#1E293B" />
  <circle cx="69.5" cy="66.5" r="1.2" fill="#FFFFFF" />
  <circle cx="92" cy="68" r="3.5" fill="#1E293B" />
  <circle cx="93.5" cy="66.5" r="1.2" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M63 59 Q68 56, 74 59" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M86 59 Q92 56, 97 59" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Cute Modern Glasses -->
  <rect x="58" y="60" width="18" height="15" rx="4" fill="none" stroke="#1E3A8A" stroke-width="2.5" />
  <rect x="84" y="60" width="18" height="15" rx="4" fill="none" stroke="#1E3A8A" stroke-width="2.5" />
  <line x1="76" y1="67" x2="84" y2="67" stroke="#1E3A8A" stroke-width="2.5" />

  <!-- Confident Friendly Smile -->
  <path d="M74 76 Q80 82, 86 76" stroke="#9A3412" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- Verified Tutor Badge -->
  <g transform="translate(112, 112) scale(0.8)">
    <circle cx="16" cy="16" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="2" />
    <path d="M11 16 L15 20 L22 12" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
